[package]
name = "model-switch"
version = "0.1.0"
description = "LLM Smart Gateway & Quota Scheduler"
authors = ["ModelSwitch"]
edition = "2021"
default-run = "model-switch"

[features]
default = ["tauri"]
tauri = ["dep:tauri", "dep:tauri-plugin-opener", "dep:tauri-build"]

[lib]
name = "model_switch_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "modelswitch-cli"
path = "src/bin/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
# Application framework (optional — CLI mode runs without Tauri)
tauri = { version = "2", features = ["tray-icon", "devtools"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }

# Async runtime & Web framework
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "compression-br", "compression-zstd", "compression-deflate", "fs"] }

# HTTP client
reqwest = { version = "0.12", features = ["stream", "cookies", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# Utilities
libc = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "2"
rand = "0.9"
futures = "0.3"
tokio-stream = "0.1"
dirs = "6"
bytes = "1"
notify = "7"
parking_lot = "0.12"
subtle = { version = "2.6.1", default-features = false }
sha2 = "0.10"
blake3 = "1"
regex = "1"
url = "2"
hmac = "0.12"
hex = "0.4"
urlencoding = "2"
async-trait = "0.1"
prometheus = "0.13"

# TLS support for native HTTPS binding
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto"] }

# MCP SDK (PoC — compile validation only)
rmcp = { version = "1.7", default-features = false, features = [
    "client",
    "server",
    "transport-child-process",
    "transport-io",
    "transport-streamable-http-server",
] }

# SMTP email notifications
lettre = { version = "0.11", default-features = false, features = [
    "tokio1-native-tls",
    "smtp-transport",
    "builder",
] }

# Enterprise authentication
ldap3 = "0.11"
base64 = "0.22"
jsonwebtoken = "9"
aes-gcm = "0.10"

[dev-dependencies]
wiremock = "0.6"
rsa = "0.9"
rand_core = "0.6"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
