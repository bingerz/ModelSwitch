# Auto-generated benchmark config for ModelSwitch gateway.
# Placeholders {{GATEWAY_PORT}} and {{MOCK_PORT}} are sed-replaced at runtime
# by benchmark/scripts/auto-bench.sh.
#
# The mock upstream accepts any API key, so the inline key here is a dummy
# value only used to satisfy the gateway's credential lookup.
#
# circuit_breaker_minutes = 0 disables the circuit breaker entirely.
# This is intentional for benchmarking — we want to measure raw proxy
# performance, not circuit breaker behavior. The burst scenario can
# trigger transient connection failures that would otherwise cascade.

[gateway]
host = "127.0.0.1"
port = {{GATEWAY_PORT}}
routing_strategy = "weighted_random"
health_check_enabled = false
cache_ttl_secs = 0
circuit_breaker_minutes = 0
max_retries = 1

[[channels]]
id = "00000000-0000-0000-0000-000000000001"
name = "Mock LLM"
provider = "openai"
priority = 1
weight = 100
credential_type = "api_key"
credential_ref = "mock_key"
api_key = "dummy-mock-key"
base_url = "http://127.0.0.1:{{MOCK_PORT}}"
enabled = true
cooldown_minutes = 0
rpm_limit = 100000
tpm_limit = 10000000
