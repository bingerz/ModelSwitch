groups:
  - name: modelswitch
    rules:
      - alert: HighErrorRate
        expr: rate(modelswitch_requests_total{status=~"5.."}[5m]) / rate(modelswitch_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ModelSwitch error rate > 5%"
      - alert: HighLatencyP99
        expr: histogram_quantile(0.99, rate(modelswitch_request_latency_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ModelSwitch P99 latency > 2s"
      - alert: ChannelCircuitOpen
        expr: modelswitch_circuit_breaker_open == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Circuit breaker open for {{ $labels.channel }}"
