name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Rust: fmt + clippy + test ──────────────────────────────
  rust-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-features -- -D warnings

      - name: Unit tests
        run: cargo test --lib --all-features

      - name: Integration tests
        run: cargo test --test api_integration --all-features

  # ── Frontend: typecheck + lint + test ───────────────────────
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # ── Security: cargo audit + cargo deny ──────────────────────
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        working-directory: src-tauri
        run: cargo audit

      - name: Install cargo-deny
        run: cargo install cargo-deny

      - name: Create deny.toml if not present
        run: |
          if [ ! -f src-tauri/deny.toml ]; then
            cat > src-tauri/deny.toml << 'DENYEOF'
          [advisories]
          db-urls = ["https://github.com/RustSec/advisory-db"]
          vulnerability = "deny"
          unmaintained = "warn"
          yanked = "deny"

          [licenses]
          allow = [
            "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
            "BSD-3-Clause", "ISC", "Unicode-DFS-2016", "Zlib", "0BSD",
            "CC0-1.0", "Unicode-3.0",
          ]
          DENYEOF
          fi

      - name: Run cargo deny
        working-directory: src-tauri
        run: cargo deny check advisories licenses
